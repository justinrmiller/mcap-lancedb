name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  test:
    name: Lint, test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # torch with its CUDA wheels (~6 GB) and the 4.5 GB model don't fit in
      # the runner's guaranteed disk space without this.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint and type-check
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: huggingface-google-siglip2-so400m-patch16-384

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/

  # The README's coverage badge reads coverage.svg from the orphan `badges`
  # branch. Pushes made with GITHUB_TOKEN don't trigger workflows.
  badge:
    name: Update coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Render the badge
        run: uvx --from "genbadge[coverage]" genbadge coverage --local -i coverage.xml -o coverage.svg

      - name: Publish to the badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir badges && mv coverage.svg badges/ && cd badges
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git commit -q -m "Coverage badge for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

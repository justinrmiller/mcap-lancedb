# This project lives in a monorepo, and pre-commit always runs from the git
# root. Every hook is therefore scoped to mcap-lancedb/, and the uv hooks point
# at this directory explicitly. Run it from here:
#
#   uv run --group dev pre-commit run --all-files
files: ^mcap-lancedb/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.9
    hooks:
      - id: uv-lock
        args: [--project, mcap-lancedb]
        files: ^mcap-lancedb/(uv\.lock|pyproject\.toml)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      # ruff finds mcap-lancedb/pyproject.toml from each file's path.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --directory mcap-lancedb --group dev ty check
        language: system
        types: [python]
        pass_filenames: false
